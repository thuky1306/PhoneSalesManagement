<!DOCTYPE html>
<html lang="vi">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Đăng Nhập - PhoneSale Store</title>
	<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
		rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

	<link rel="stylesheet" href="css/login.css">
</head>

<body>

	<div class="auth-card">
		<div class="auth-header">
			<a href="#" class="brand-logo">PhoneSale<span>.</span></a>
			<h2>Chào mừng trở lại!</h2>
			<p>Nhập thông tin để truy cập tài khoản của bạn</p>
		</div>

		<form id="loginForm" novalidate>
			<div class="form-group">
				<label class="form-label">Email hoặc Số điện thoại</label>
				<div class="input-wrapper">
					<i class="fa fa-envelope-o input-icon"></i>
					<input type="text" class="form-input" placeholder="nhapemail@domain.com" required>
				</div>
			</div>

			<div class="form-group">
				<label class="form-label">Mật khẩu</label>
				<div class="input-wrapper">
					<i class="fa fa-lock input-icon"></i>
					<input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required>
					<i class="fa fa-eye toggle-password" onclick="togglePasswordVisibility('loginPassword', this)"></i>
				</div>
			</div>

			<div class="form-actions">
				<label class="remember-me">
					<input type="checkbox" id="rememberMe">
					<span>Ghi nhớ đăng nhập</span>
				</label>
				<a href="#" class="forgot-link">Quên mật khẩu?</a>
			</div>

			<button type="submit" class="btn-primary">Đăng Nhập</button>
		</form>

		<div class="divider"><span>Hoặc tiếp tục với</span></div>

		<div class="social-login">
			<a href="#" class="btn-social btn-google">
				<i class="fa fa-google"></i> Google
			</a>
			<a href="#" class="btn-social btn-facebook">
				<i class="fa fa-facebook-official"></i> Facebook
			</a>
		</div>

		<div class="auth-footer">
			Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a>
		</div>
	</div>

	<script>
		function togglePasswordVisibility(inputId, icon) {
			const input = document.getElementById(inputId);
			if (input.type === 'password') {
				input.type = 'text';
				icon.classList.remove('fa-eye');
				icon.classList.add('fa-eye-slash');
			} else {
				input.type = 'password';
				icon.classList.remove('fa-eye-slash');
				icon.classList.add('fa-eye');
			}
		}

		document.addEventListener('DOMContentLoaded', function () {
			const loginForm = document.getElementById('loginForm');
			const accountInput = loginForm.querySelector('input[type="text"]');
			const passwordInput = document.getElementById('loginPassword');
			const rememberMeCheckbox = document.getElementById('rememberMe');

			function showError(input, message) {
				const wrapper = input.closest('.form-group');
				let errorElem = wrapper.querySelector('.error-msg');
				if (!errorElem) {
					errorElem = document.createElement('small');
					errorElem.className = 'error-msg';
					errorElem.style.color = '#d10024';
					errorElem.style.fontSize = '12px';
					errorElem.style.marginTop = '4px';
					errorElem.style.display = 'block';
					wrapper.appendChild(errorElem);
				}
				errorElem.innerText = message;
				input.style.borderColor = '#d10024';
			}

			function clearError(input) {
				const wrapper = input.closest('.form-group');
				const errorElem = wrapper.querySelector('.error-msg');
				if (errorElem) {
					errorElem.remove();
				}
				input.style.borderColor = '#eef0f4';
			}

			function validateEmailOrPhone(input) {
				const value = input.value.trim();
				const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
				const phoneRegex = /(84|0[3|5|7|8|9])+([0-9]{8})\b/;

				if (value === '') {
					showError(input, 'Vui lòng nhập Email hoặc Số điện thoại.');
					return false;
				} else if (!emailRegex.test(value) && !phoneRegex.test(value)) {
					showError(input, 'Email hoặc Số điện thoại không đúng định dạng.');
					return false;
				}
				clearError(input);
				return true;
			}

			function validatePassword(input) {
				if (input.value.trim() === '') {
					showError(input, 'Vui lòng nhập mật khẩu.');
					return false;
				}
				clearError(input);
				return true;
			}

			accountInput.addEventListener('blur', () => validateEmailOrPhone(accountInput));
			passwordInput.addEventListener('blur', () => validatePassword(passwordInput));

			loginForm.addEventListener('submit', function (e) {
				e.preventDefault();

				const isAccountValid = validateEmailOrPhone(accountInput);
				const isPasswordValid = validatePassword(passwordInput);

				if (isAccountValid && isPasswordValid) {
					const accountValue = accountInput.value.trim();
					const passwordValue = passwordInput.value;

					const users = JSON.parse(localStorage.getItem('users')) || [];

					const user = users.find(u => u.email === accountValue || u.phone === accountValue);

					if (!user) {
						showError(accountInput, 'Tài khoản không tồn tại trong hệ thống.');
						return;
					}

					if (user.password !== passwordValue) {
						showError(passwordInput, 'Mật khẩu không chính xác.');
						return;
					}

					const sessionUser = {
						id: user.id,
						fullName: user.fullName,
						email: user.email,
						phone: user.phone
					};

					if (rememberMeCheckbox.checked) {
						localStorage.setItem('currentUser', JSON.stringify(sessionUser));
					} else {
						sessionStorage.setItem('currentUser', JSON.stringify(sessionUser));
					}

					alert(`Đăng nhập thành công! Chào mừng ${user.fullName}`);
					window.location.href = 'index.html';
				}
			});
		});
	</script>
</body>

</html>
